<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VSD Quiz — Team Registration</title>
<link rel="stylesheet" href="shared/theme.css">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
  .wrap{max-width:560px;margin:0 auto;padding:32px 20px 60px;}
  .field{margin-bottom:14px;}
  label{font-size:12px;color:var(--ink-dim);display:block;margin-bottom:5px;}
  .names-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px;}
  .team-pick{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
  .team-pick .opt{padding:10px 16px;border-radius:10px;border:1px solid var(--line);cursor:pointer;font-weight:700;}
  .team-pick .opt.taken{opacity:.25;cursor:not-allowed;text-decoration:line-through;}
  .team-pick .opt.selected{border-color:var(--gold-bright);box-shadow:0 0 16px rgba(246,216,136,.4);background:rgba(232,189,92,.15);}
  .success-box{text-align:center;padding:40px 24px;}
  .code-big{font-family:'Cinzel',serif;font-size:34px;letter-spacing:.2em;color:var(--gold-bright);margin:14px 0;}
</style>
</head>
<body>
<div class="wrap">
  <div class="panel fade-in" style="padding:26px;" id="card">
    <div class="eyebrow">VSD Prabhu Pooja &amp; Guru Vandan</div>
    <h1 style="margin-bottom:6px;">Team Registration</h1>
    <p style="color:var(--ink-dim);font-size:14px;margin-bottom:20px;">One entry per mobile number. Once submitted, details can't be self-edited — call the enquiry number for changes.</p>

    <div class="field"><label>Select Team Name</label>
      <div class="team-pick" id="teamPick"></div>
    </div>
    <div class="field"><label>Parent / Captain Name</label><input id="captain"></div>
    <div class="field"><label>Mobile Number</label><input id="phone" type="tel"></div>
    <div class="field"><label>Pathshala Name</label><input id="pathshala"></div>
    <div class="field"><label>Members (min 5, max 7)</label>
      <div class="names-grid" id="membersGrid"></div>
      <div class="row" style="gap:8px;">
        <button class="btn btn-outline" type="button" onclick="addMemberField()">+ Add Member</button>
      </div>
    </div>
    <button class="btn btn-gold btn-lg" style="width:100%;margin-top:10px;" onclick="submitRegistration()">SUBMIT REGISTRATION</button>
    <div id="regError" style="color:var(--red);margin-top:10px;font-size:14px;"></div>
  </div>
</div>

<script src="shared/supabase-client.js"></script>
<script>
let event = null, selectedTeamName = null, memberCount = 0;

window.addEventListener('DOMContentLoaded', async () => {
  event = await getActiveEvent();
  await loadTeamNames();
  for (let i=0;i<5;i++) addMemberField();
});

async function loadTeamNames() {
  const { data } = await sb.from('quiz_team_names').select('*').eq('event_id', event.id).order('team_name');
  document.getElementById('teamPick').innerHTML = (data||[]).map(t =>
    `<div class="opt ${t.taken?'taken':''}" ${t.taken?'':`onclick="pickTeam('${t.team_name}')"`} id="opt-${t.team_name}">${t.team_name}</div>`).join('');
}
function pickTeam(name) {
  selectedTeamName = name;
  document.querySelectorAll('.team-pick .opt').forEach(el => el.classList.remove('selected'));
  document.getElementById('opt-' + name).classList.add('selected');
}
function addMemberField() {
  if (memberCount >= 7) return toast('Maximum 7 members');
  memberCount++;
  const grid = document.getElementById('membersGrid');
  const div = document.createElement('input');
  div.placeholder = 'Member ' + memberCount + ' full name';
  div.className = 'member-input';
  grid.appendChild(div);
}

async function submitRegistration() {
  const err = document.getElementById('regError');
  err.textContent = '';
  if (!selectedTeamName) return err.textContent = 'Please select a team name.';
  const captain = document.getElementById('captain').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const pathshala = document.getElementById('pathshala').value.trim();
  const members = [...document.querySelectorAll('.member-input')].map(i => i.value.trim()).filter(Boolean);

  if (!captain || !phone) return err.textContent = 'Captain name and mobile number are required.';
  if (members.length < 5) return err.textContent = 'Please enter at least 5 members.';

  const { data, error } = await sb.rpc('register_team', {
    p_event_id: event.id, p_team_name: selectedTeamName, p_captain_name: captain,
    p_phone: phone, p_pathshala: pathshala, p_members: members
  });
  if (error) { err.textContent = error.message; await loadTeamNames(); return; }

  const { data: team } = await sb.from('quiz_teams').select('team_code').eq('id', data).single();
  document.getElementById('card').innerHTML = `
    <div class="success-box">
      <div class="eyebrow">Registration Complete</div>
      <h1>Welcome, Team ${selectedTeamName}!</h1>
      <p style="color:var(--ink-dim);">Give this code to your team device on quiz day</p>
      <div class="code-big">${team.team_code}</div>
    </div>`;
}
</script>
</body>
</html>
